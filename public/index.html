<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seren Encryptor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #050416;
    --bg2: #0b122a;
    --accent1: #7c3aed;
    --accent2: #5b21b6;
    --accent3: #00c6ff;
    --text: #f1f4fa;
    --muted: #9ba3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --radius: 14px;
    --transition: 0.25s ease;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', sans-serif; color: var(--text);
    background: radial-gradient(circle at 25% 10%, rgba(124,58,237,0.12), transparent 25%), linear-gradient(180deg, var(--bg1), var(--bg2));
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }
  h1, p { margin: 0; }/* Header */
header {
width: 100%; max-width: 960px; display: flex; align-items: center; justify-content: space-between;
padding: 20px 24px; margin-top: 10px;
}
.logo-wrap {
display: flex; align-items: center; gap: 10px;
}
.logo {
width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
animation: spin 6s linear infinite;
box-shadow: 0 0 24px rgba(124,58,237,0.3);
}
.logo img { width: 100%; height: 100%; object-fit: cover; }
@keyframes spin { 0% {transform: rotate(0);} 100% {transform: rotate(360deg);} }

.title-text { display: flex; flex-direction: column; }
.title-text h1 {
font-size: 20px; font-weight: 800;
background: linear-gradient(90deg, var(--accent1), var(--accent3));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.title-text p { font-size: 13px; color: var(--muted); }

.server-status {
display: flex; align-items: center; gap: 8px;
background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
padding: 8px 14px; border-radius: 999px; font-size: 13px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; transition: all var(--transition); }
.dot.on { background: var(--success); box-shadow: 0 0 10px rgba(34,197,94,0.6); }
.dot.off { background: var(--danger); box-shadow: 0 0 10px rgba(239,68,68,0.4); }

/* Card main */
.card {
width: 100%; max-width: 900px; background: rgba(255,255,255,0.02);
border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius);
padding: 28px; margin-top: 24px;
box-shadow: 0 10px 40px rgba(8,8,20,0.5); backdrop-filter: blur(10px);
}
.dropzone {
border: 2px dashed rgba(255,255,255,0.07); border-radius: var(--radius);
padding: 50px 20px; text-align: center; cursor: pointer;
transition: all var(--transition);
}
.dropzone:hover { border-color: var(--accent1); background: rgba(124,58,237,0.03); }
.dropzone.dragover { border-color: var(--accent3); background: rgba(0,198,255,0.06); }
.dropzone strong { display: block; font-size: 16px; }
.dropzone small { color: var(--muted); display: block; margin-top: 6px; font-size: 13px; }

/* Buttons */
.buttons { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
button {
position: relative; font-size: 15px; font-weight: 700;
border: none; outline: none; cursor: pointer;
border-radius: var(--radius); padding: 12px 22px;
color: white; background: linear-gradient(90deg, var(--accent1), var(--accent3));
box-shadow: 0 0 20px rgba(124,58,237,0.25);
transition: all var(--transition);
}
button:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(124,58,237,0.4); }
button.secondary { background: rgba(255,255,255,0.03); color: var(--muted); box-shadow: none; }
button.secondary:hover { background: rgba(255,255,255,0.05); }

select, input[type="text"], input[type="password"] {
width: 100%; background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.08);
border-radius: var(--radius); color: var(--text);
padding: 10px 12px; margin-top: 8px;
}
.panel { margin-top: 20px; }
.label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: block; }

.progress {
width: 100%; height: 10px; background: rgba(255,255,255,0.05);
border-radius: 999px; overflow: hidden; margin-top: 16px;
}
.bar {
height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent1), var(--accent3));
transition: width 0.3s ease;
}

.status { font-size: 13px; margin-top: 10px; color: var(--muted); text-align: center; }
.status.ok { color: var(--success); }
.status.err { color: var(--danger); }

footer {
margin-top: 40px; text-align: center; font-size: 13px; color: var(--muted);
}

@media (max-width:600px){
.card{padding:20px;}
.logo{width:52px;height:52px;}
.title-text h1{font-size:18px;}
button{width:100%;}
}
</style>

</head>
<body><header>
  <div class="logo-wrap">
    <div class="logo"><img src="logo.jpg" alt="Seren Logo"></div>
    <div class="title-text">
      <h1>Seren Encryptor</h1>
      <p>Encryptor JavaScript dengan style elegan dan aman.</p>
    </div>
  </div>
  <div class="server-status" id="serverBox">
    <div id="dot" class="dot off"></div>
    <div id="serverText">Server: Offline</div>
  </div>
</header><main class="card">
  <div id="dropzone" class="dropzone">
    <strong>Drop file .js kamu di sini</strong>
    <small>atau klik untuk memilih dari perangkat</small>
  </div>
  <input type="file" id="fileInput" accept=".js" hidden>
  <div class="buttons">
    <button id="chooseBtn">Pilih File</button>
    <button id="resetBtn" class="secondary">Reset</button>
  </div>  <div class="panel">
    <label class="label">Preset</label>
    <select id="preset">
      <option value="ultra">Ultra (Strong)</option>
      <option value="nova">Nova (Balanced)</option>
      <option value="nebula">Nebula (Shuffle)</option>
      <option value="arab">Arab Style</option>
      <option value="japan">Japan Style</option>
      <option value="japanxarab">Japan × Arab</option>
    </select><label class="label" style="margin-top:10px;">Output filename</label>
<input type="text" id="filename" placeholder="Encrypted.js">

<div style="margin-top:14px;">
  <input type="checkbox" id="pwCheck"> <label for="pwCheck">Password-protect</label>
  <div id="pwInput" style="display:none;">
    <input type="password" id="password" placeholder="Masukkan password">
  </div>
</div>

<div style="margin-top:8px;">
  <input type="checkbox" id="bypassCheck"> <label for="bypassCheck">Enable anti-bypass (risky)</label>
</div>

  </div>  <div class="buttons" style="margin-top:22px;">
    <button id="encryptBtn">Encrypt & Download</button>
  </div>  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Menunggu file...</div>
</main><footer>
  <p>© 2025 Seren Encryptor • Keamanan yang terjamin</p>
</footer><script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const dot = document.getElementById('dot');
const serverText = document.getElementById('serverText');

let selectedFile = null;
let serverOnline = false;

function setStatus(msg,type){
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}
function setProgress(p){ bar.style.width = p + '%'; }

function setServer(on){
  serverOnline = on;
  if(on){
    dot.classList.add('on'); dot.classList.remove('off');
    serverText.textContent = 'Server: Online';
  } else {
    dot.classList.add('off'); dot.classList.remove('on');
    serverText.textContent = 'Server: Offline';
  }
}

async function checkServer(){
  try {
    const res = await fetch('/health', {cache:'no-store'});
    setServer(res.ok);
  } catch { setServer(false); }
}
checkServer();
setInterval(checkServer, 5000);

dropzone.addEventListener('click',()=>fileInput.click());
dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('dragover');});
dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',e=>{
  e.preventDefault(); dropzone.classList.remove('dragover');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));

function handleFile(file){
  if(!file.name.endsWith('.js')) return setStatus('❌ Hanya file .js diperbolehkan','err');
  selectedFile=file;
  setStatus('✅ File dipilih: '+file.name+' ('+(file.size/1024).toFixed(1)+'KB)','ok');
}

document.getElementById('chooseBtn').onclick=()=>fileInput.click();
document.getElementById('resetBtn').onclick=()=>{selectedFile=null;fileInput.value='';setStatus('Menunggu file...');setProgress(0);};

document.getElementById('pwCheck').onchange=(e)=>{document.getElementById('pwInput').style.display=e.target.checked?'block':'none';};

document.getElementById('encryptBtn').onclick=async()=>{
  if(!serverOnline) return setStatus('❌ Server offline','err');
  if(!selectedFile) return setStatus('⚠️ Pilih file .js dahulu','err');
  setProgress(10); setStatus('⏳ Mengunggah & memproses...');
  const fd=new FormData();
  fd.append('file',selectedFile,selectedFile.name);
  fd.append('preset',document.getElementById('preset').value);
  const fname=document.getElementById('filename').value.trim();
  if(fname) fd.append('filename',fname);
  if(document.getElementById('pwCheck').checked) fd.append('password',document.getElementById('password').value.trim());
  fd.append('includeAntiBypass',document.getElementById('bypassCheck').checked?'1':'0');
  try{
    const res=await fetch('/encrypt',{method:'POST',body:fd});
    if(!res.ok) throw new Error('Server error');
    setProgress(70);
    const blob=await res.blob();
    setProgress(100);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=fname||'Encrypted.js'; a.click();
    setStatus('✅ Selesai! File diunduh.','ok');
  }catch(e){
    setStatus('❌ Gagal: '+e.message,'err');
  }
};
</script></body>
  </html>
